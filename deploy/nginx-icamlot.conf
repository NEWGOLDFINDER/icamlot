# Site ICAM LOT : accueil (intro tronçonneuse), compteur de points, simulation du plateau.
# HTTP seulement : le HTTPS est assuré par le tunnel Cloudflare (cloudflared).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name icamlot.arkode-studio.fr _;

    root /var/www/icamlot;
    index index.html;
    # Redirections relatives : derrière Cloudflare, nginx ne voit que du HTTP.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Pages HTML : toujours revalidées pour voir les mises à jour tout de suite.
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }
    location ~ /$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
    # Scripts et styles (bareme.js...) : revalidés aussi ; leurs adresses changent à chaque version.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Simulateur et Atelier Cerveau : réservés aux personnes connectées (mot de passe d'équipe).
    location ^~ /plateau/ {
        auth_request /api/auth;
        error_page 401 = @connexion;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
    location ^~ /cerveau/ {
        auth_request /api/auth;
        error_page 401 = @connexion;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
    location ^~ /engine/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
    location @connexion {
        return 302 /connexion/?suite=$uri;
    }

    # Vérification de session : utilisée par auth_request et par la page de connexion.
    location = /api/auth {
        proxy_pass http://127.0.0.1:8081;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # API (api/server.py, service icamlot-api) : connexion et stratégies.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 1m;
    }
}
