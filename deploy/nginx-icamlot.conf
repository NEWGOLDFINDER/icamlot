# Site ICAM LOT : accueil (intro tronçonneuse), compteur de points, simulation du plateau.
# HTTP seulement : le HTTPS est assuré par le tunnel Cloudflare (cloudflared).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name icamlot.arkode-studio.fr _;

    root /var/www/icamlot;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Pages HTML : toujours revalidées pour voir les mises à jour tout de suite.
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }
    location ~ /$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # API des stratégies (api/server.py, service icamlot-api).
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 1m;
    }
}
