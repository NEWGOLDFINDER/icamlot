[pytest]
testpaths = tests trainer
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    tier1: Tier 1 Feature Coverage tests
    tier2: Tier 2 Boundary & Corner Case tests
    tier3: Tier 3 Cross-Feature Interaction tests
    tier4: Tier 4 Real-World Application Scenario tests
    f1: Feature 1 - 2D GPU Distance Grid & Wavefront
    f2: Feature 2 - Dynamic Envelope Dilation
    f3: Feature 3 - Real-Time Topological Closures
    f4: Feature 4 - Staging & Relay Drop Zones
    f5: Feature 5 - Packet Re-Pickup Mechanics
    f6: Feature 6 - 90 deg Gripper Folding
    f7: Feature 7 - Sokoban Curriculum Resets
    f8: Feature 8 - GPU State Cloning & Restoration
    f9: Feature 9 - Object-Centric Entity Tokenizer
    f10: Feature 10 - 2-Layer Self-Attention Transformer
    f11: Feature 11 - Auxiliary World-Model Head
    f12: Feature 12 - Auxiliary MSE Loss Integration
    f13: Feature 13 - Production ONNX Export Isolation
    f14: Feature 14 - Edge CPU Inference & Tree Search
    m1: Milestone 1 Features (F1-F8)
    m2: Milestone 2 Features (F9-F14)
    m3: Milestone 3 Features (Tree Search & Duels)
