# Site statique : compteur de points uniquement.
# HTTP seulement : le HTTPS est assuré par le tunnel Cloudflare (cloudflared).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name icamlot.arkode-studio.fr _;

    root /var/www/point-counter;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
