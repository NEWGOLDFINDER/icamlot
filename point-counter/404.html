<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable — Team Opossum</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/opossum-logo.ico" sizes="any" />
  <link rel="icon" href="/opossum-logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root { --jaune: #f5c518; --fond: #0e0f13; --texte: #f2f3f5; --texte-doux: #a9adba; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', system-ui, sans-serif; background: var(--fond); color: var(--texte);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem;
    }
    .code { font-size: clamp(5rem, 20vw, 11rem); font-weight: 800; line-height: 1; color: var(--jaune); text-shadow: 0 6px 30px rgba(0,0,0,0.5); }
    h1 { font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 600; margin: 0.4rem 0 0.8rem; }
    p { color: var(--texte-doux); max-width: 460px; margin: 0 auto 2rem; }
    a.btn {
      display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.85rem 1.8rem; border-radius: 999px;
      background: var(--jaune); color: #17130a; font-weight: 600; text-decoration: none; transition: transform 0.15s, box-shadow 0.15s;
    }
    a.btn:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,0.4); }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Oups, ce robot s'est perdu&nbsp;!</h1>
    <p>La page que vous cherchez n'existe pas ou a été déplacée. Revenons sur la piste.</p>
    <a class="btn" href="/">← Retour à l'accueil</a>
  </main>
</body>
</html>
